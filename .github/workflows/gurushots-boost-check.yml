name: GuruShots boost check

on:
  schedule:
    # Runs every 30 minutes, offset from :00/:30 since those are the
    # busiest minutes on GitHub's shared schedulers and get delayed or
    # dropped under load far more than an off-peak minute does.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  check-boost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install curl_cffi

      - name: Run boost check
        env:
          GURUSHOTS_EMAIL: ${{ secrets.GURUSHOTS_EMAIL }}
          GURUSHOTS_PASSWORD: ${{ secrets.GURUSHOTS_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python gurushots_boost_check.py
